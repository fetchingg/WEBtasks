<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        body {
            background: #d6f1ff;
            font-family: Inter, sans-serif;
            color: #111;
        }

        .navbar-custom {
            background: #8faab8;
            height: 90px;
            border-bottom: 1px solid #ececec;
        }

        .logo {
            font-size: 38px;
            font-weight: 800;
        }

        .nav-link-custom {
            color: #222;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            transition: .2s;
        }

        .nav-link-custom:hover {
            color: black;
        }

        .category-bar {
            background: white;
            padding: 20px 0;
        }

        .category-link {
            color: #222;
            text-decoration: none;
            font-weight: 500;
            margin-right: 35px;
            font-size: 18px;
        }

        .hero-title {
            font-size: 64px;
            font-weight: 800;
            margin-top: 120px;
            margin-bottom: 50px;
        }

         .calendar-container {
            background: white;
            padding: 30px;
            border-radius: 30px;

            width: 100%;
            max-width: 1000px;

            box-shadow: 0 5px 25px rgba(0,0,0,.05);
            }

        .flatpickr-calendar {
            width: 100% !important;
            max-width: 100% !important;

            box-shadow: none !important;
            border: none !important;
        }

        .flatpickr-days {
            width: 100% !important;
        }

        .dayContainer {
            width: 100% !important;
            min-width: 100% !important;
            max-width: 100% !important;
        }

        .flatpickr-day {
            height: 50px !important;
            line-height: 50px !important;

            max-width: none !important;

            font-size: 30px;
            font-weight: 600;
        }

       .filter-btn {
            background: white;
            border-radius: 16px;
            padding: 12px 20px;
            border: none;
            font-weight: 600;
        }

       .event-card {
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            height: 520px;
            background-size: cover;
            background-position: center;
        }

       .event-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,.1));
        }

       .event-content {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: white;
            z-index: 2;
        }

       .event-title {
            font-size: 42px;
            font-weight: 700;
        }

       .small-card {
            height: 520px;
            border-radius: 30px;
            background: #7d93a7;
        }


        .flatpickr-day.selected {
            background: black !important;
            border-color: black !important;
        }

        .flatpickr-day.today {
            border-color: #999 !important;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">

        <a class="navbar-brand logo" href="/">
            Афиша
        </a>

            <div class="dropdown">

    <button class="btn nav-link-custom dropdown-toggle"
            data-bs-toggle="dropdown">

        <i class="bi bi-geo-alt-fill"></i>
        {{ city }}

    </button>

    <ul class="dropdown-menu">

        <li>
            <a class="dropdown-item"
               href="/?city=Москва">
                Москва
            </a>
        </li>

        <li>
            <a class="dropdown-item"
               href="/?city=Саратов">
                Саратов
            </a>
        </li>

        <li>
            <a class="dropdown-item"
               href="/?city=Санкт-Петербург">
                Санкт-Петербург
            </a>
        </li>

        <li>
            <a class="dropdown-item"
               href="/?city=Казань">
                Казань
            </a>
        </li>

    </ul>

</div>

            <a href="#" class="nav-link-custom">
                Мои билеты
            </a>

             <a href="#" class="nav-link-custom">
                Личный кабинет
            </a>

            <div class="rounded-circle bg-warning d-flex align-items-center justify-content-center"
                 style="width:45px; height:45px;">
                <i class="bi bi-person-fill"></i>
            </div>

        </div>

    </div>
</nav>



{% block content %}
{% endblock %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Flatpickr -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<!-- Russian locale -->
<script src="https://npmcdn.com/flatpickr/dist/l10n/ru.js"></script>

<!-- Calendar Init -->
<script>

document.addEventListener("DOMContentLoaded", function () {

    flatpickr("#calendar", {
        inline: true,
        locale: flatpickr.l10ns.ru,
        defaultDate: "today",
        minDate: "today",
        showMonths: 1,

        onChange: function(selectedDates, dateStr) {
            console.log("Дата:", dateStr);
        }
    });

});

</script>

</body>
</html>
