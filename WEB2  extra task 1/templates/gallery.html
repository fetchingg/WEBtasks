{% extends "base.html" %}

{% block content %}

<h2>Пейзажи Марса</h2>

{% for img in images %}
    <img src="{{ url_for('static', filename='img/' + img) }}" width="300"><br><br>
{% endfor %}

<hr>

<h3>Добавить картинку</h3>

<form method="post" enctype="multipart/form-data">
    <input type="file" name="file">
    <button type="submit">Отправить</button>
</form>

{% endblock %}
